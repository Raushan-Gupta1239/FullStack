<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .cantainer {
            background-color:white;
            border: solid 1px black;
        }
        .nav {
            background-color: grey;
            display: flex;
            align-items: center;
        }
        .lis {
            display: flex;
            justify-content: space-between;
            list-style-type: none;
            column-gap: 60%;
            margin: 25px;
            color: white;
            box-shadow: 10px 10px 5px grey;
        }
        
    </style>
</head>
<body>
    <div class="cantainer">
        <div class="nav">
            <ul class="lis">
                <li style="font-size: 20px;">TechNova</li>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>Contact</li>
                <button>Login</button>
            </ul>
        </div>
    </div>
</body>
</html>
